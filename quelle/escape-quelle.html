<script type="module">

const VW=()=>document.documentElement.clientWidth||window.innerWidth,VH=()=>document.documentElement.clientHeight||window.innerHeight;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

//#GEN-START
/* ======================= Rätsel-Generator (pro Spiel neu) ======================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const WORDS=['','EINS','ZWEI','DREI','VIER','FÜNF','SECHS','SIEBEN','ACHT','NEUN'];

const X=s=>String(s).replace(/\^(\d+)/g,'<sup>$1</sup>'); // "2^5" -> 2<sup>5</sup>
const COLORS={rot:'#ef4444',gelb:'#facc15','grün':'#22c55e',blau:'#3b82f6',violett:'#a855f7',orange:'#f97316'};
const FLAGOF={rot:'stars',gelb:'tablet','grün':'console',blau:'scale',violett:'scope',orange:'crate'};

  const R=mulberry32(seed),ri=(a,b)=>a+Math.floor(R()*(b-a+1)),pick=a=>a[Math.floor(R()*a.length)],

  let items=null;
  for(let t=0;t<5000&&!items;t++){
    const tp=pick(TRAPS),it=[[tp[0],tp[1]],[tp[1],tp[0]]].map(([a,n])=>({a,n,v:a**n,k:'pow',trap:1}));
    
    if(ERW){const sp=pick(['a0','1n','0n','a1']);let s;

    const big=it.filter(i=>i.v>=8).map(i=>i.v),lo=Math.min(...big),hi=Math.max(...big);

  }

      if(sp==='zwei'){const tt=terms.find(x=>x.e<=8&&!ex.includes(x.e+1));if(!tt)continue;tt.c=pick([11,12,13,14,15,21,23,25,32,35,41,45,52,64,75]);}
      else if(sp==='mio'){const tt=terms.find(x=>x.e===6);if(!tt)continue;tt.mio=1}
      else{const tt=terms.find(x=>x.e===0);if(!tt)continue}
      terms=shuffle(terms)}

    P.dist=v;P.distT=terms.map(x=>x.t).join(' + ');P.distDig=String(v).padStart(10,'0').split('').map(Number);break}

  const REP={};const rep=(v,s)=>{(REP[v]=REP[v]||[]).push(s)};

  const EX={1:['7^0','1^8','9^0'],12:['3 · 2^2'],18:['2 · 3^2'],20:['5 · 2^2'],24:['3 · 2^3'],36:['(2 · 3)^2'],40:['5 · 2^3'],48:['3 · 4^2'],50:['2 · 5^2'],54:['2 · 3^3'],13:['5 + 2^3'],100:['(2 · 5)^2'],17:['1 + 2^4'],28:['1 + 3^3']};

    if(!ws.some(w=>w.k!=='x')){const c=ws.find(w=>(REP[w.v]||[]).some(s=>s.startsWith('#W')));if(c){c.t=REP[c.v].find(s=>s.startsWith('#W')).slice(2);c.k='word'}}

    const tp=POOL.find(p=>p.v===T);P.wts=ws;P.T=T;P.TT=tp&&R()<.5?`${tp.a}^${tp.n}`:String(T);P.used=used;P.blue=ri(2,9);break}

const endPtr=e=>{const p=pointers.get(e.pointerId);if(!p)return;pointers.delete(e.pointerId);
  if(p.type==='move'){joy.x=joy.y=0;$('#joy').style.display='none';$('#joy i').style.transform=''}
  if(!p.moved&&performance.now()-p.t<600&&e.type==='pointerup')interactAt(e.clientX,e.clientY)};
canvas.addEventListener('pointerup',endPtr);canvas.addEventListener('pointercancel',endPtr);
function collide(p){const r=.32;p.x=Math.max(-W+r+.05,Math.min(W-r-.05,p.x));p.z=Math.max(-D+r+.05,Math.min(D-r-.05,p.z));
  for(const o of obstacles){const x1=o.x1-r,x2=o.x2+r,z1=o.z1-r,z2=o.z2+r;
    if(p.x>x1&&p.x<x2&&p.z>z1&&p.z<z2){const dl=p.x-x1,dr=x2-p.x,dt=p.z-z1,db=z2-p.z,m=Math.min(dl,dr,dt,db);if(m===dl)p.x=x1;else if(m===dr)p.x=x2;else if(m===dt)p.z=z1;else p.z=z2}}}
const ray=new THREE.Raycaster();
function idOf(o){while(o){if(o.userData&&o.userData.id)return o.userData.id;o=o.parent}return null}
const hitOK=h=>h.object.visible&&!h.object.isPoints&&!h.object.userData.noHit&&h.object.type!=='LineSegments'&&h.object.type!=='Line';
function pickAt(cx,cy){ray.setFromCamera(new THREE.Vector2(cx/VW()*2-1,-(cy/VH())*2+1),camera);const hit=ray.intersectObjects(scene.children,true).find(hitOK);if(!hit)return null;const id=idOf(hit.object);return id?{id,d:hit.distance}:null}
function interactAt(cx,cy){if(uiOpen||!S||S.end)return;
  let h=pickAt(cx,cy);
  if(!h){const r=isTouch?26:12;for(const[dx,dy]of[[0,-1],[1,0],[0,1],[-1,0],[.7,-.7],[.7,.7],[-.7,.7],[-.7,-.7]]){const c=pickAt(cx+dx*r,cy+dy*r);if(c&&(!h||c.d<h.d))h=c}}
  if(!h)return;
  if(h.d>3.6){toast('Zu weit weg – geht näher heran.');return}
  interact(h.id)}

/* ---------- Sternkarte (ROT) ---------- */
function starmapUI(){
  const svg=(seq,solved)=>{const R=mulberry32(P.seed^5);let s=`<svg viewBox="0 0 600 390" style="width:100%;max-height:47vh;display:block;background:radial-gradient(#16224d,#070b1f);border-radius:12px;touch-action:manipulation">`;
    for(let i=0;i<120;i++)s+=`<circle cx="${R()*600}" cy="${R()*390}" r="${R()*1.4+.3}" fill="#fff" opacity="${R()*.6+.1}"/>`;
    const ord=solved?P.stars.map((_,i)=>i).sort((a,b)=>P.stars[a].v-P.stars[b].v):seq;
    for(let i=1;i<ord.length;i++){const a=P.stars[ord[i-1]],b=P.stars[ord[i]];s+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${solved?'#ff4d4d':'#f4c25b'}" stroke-width="${solved?4:3}" ${solved?'':'stroke-dasharray="8 6"'} opacity=".9"/>`}
    P.stars.forEach((st,i)=>{const k=seq.indexOf(i);s+=`<g data-s="${i}" style="cursor:pointer"><circle cx="${st.x}" cy="${st.y}" r="34" fill="transparent"/><circle cx="${st.x}" cy="${st.y}" r="${k>=0||solved?11:9}" fill="${solved?'#ff6b6b':k>=0?'#ffd34d':'#fff7d6'}" style="filter:drop-shadow(0 0 6px #ffe08a)"/>
      <text x="${st.x}" y="${st.y+(st.t.length>14?32:36)}" text-anchor="middle" font-size="${st.t.length>14?15:21}" font-weight="700" fill="#f4e2b0">${svgX(st.t)}</text>
      ${solved?`<text x="${st.x}" y="${st.y-20}" text-anchor="middle" font-size="28" font-weight="700" fill="#ff8080">${st.l}</text>`:k>=0?`<text x="${st.x+17}" y="${st.y-12}" font-size="15" font-weight="700" fill="#ffd34d">${k+1}</text>`:''}</g>`});
    return s+'</svg>'};
  if(S.f.stars){openPanel('✨ Sternkarte',svg([],true)+`<p>Das Sternbild leuchtet rot. Entlang der Linie – vom kleinsten zum grössten Stern – liest man: <b style="color:#ff8080;letter-spacing:.15em">${P.word}</b></p>`,[{label:'OK',cls:'primary'}]);return}
  let seq=[];
  const draw=body=>{body.innerHTML=`<p>Auf dem Kartentisch liegt eine Sternkarte. Sechs helle Sterne sind beschriftet. Tippt die Sterne nacheinander an, um sie mit einer Linie zu verbinden (nochmals tippen = letzten Stern entfernen).</p>${memo(S.notes.includes('globenote'),'Zettel unter dem Globus – «vom <u>kleinsten</u> zum <u>grössten</u> Wert verbinden».')}${svg(seq,false)}`;
    body.querySelectorAll('[data-s]').forEach(el=>el.onclick=()=>{const i=+el.dataset.s;sfx.click();if(seq[seq.length-1]===i)seq.pop();else if(!seq.includes(i))seq.push(i);draw(body)})};
  openPanel('✨ Sternkarte','',[{label:'Schliessen'},{label:'Neu beginnen',keep:true,fn:()=>{seq=[];draw($('#pbody'))}},{label:'✨ Sternbild prüfen',cls:'primary',keep:true,fn:()=>{if(!once())return;
    if(seq.length<6){toast('Verbindet zuerst alle sechs Sterne.');return}
    const ok=seq.every((i,k)=>k===0||P.stars[seq[k-1]].v<P.stars[i].v);
    if(ok){S.f.stars=true;save();mapMesh.material.map=mapTex(true);mapMesh.material.needsUpdate=true;mapLight.intensity=4;confetti(30);starmapUI()}
    else{wrong('Die Sterne flackern kurz – und erlöschen. Die Reihenfolge stimmt noch nicht.');seq=[];draw($('#pbody'))}}}],draw);
}

const clock=new THREE.Clock();
function loop(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;

    if(keys.w||keys.arrowup)f+=1;if(keys.s||keys.arrowdown)f-=1;if(keys.d)s+=1;if(keys.a)s-=1;
    if(keys.arrowleft)yaw+=1.8*dt;if(keys.arrowright)yaw-=1.8*dt;
    const l=Math.hypot(f,s);if(l>1){f/=l;s/=l}
    const sp=2.3*dt;pos.x+=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*sp;pos.z+=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*sp;collide(pos)}

    if(anim.gnote){const tx=S.f.gnote?-4.65:-4.82,tz=S.f.gnote?3.55:3.78;anim.gnote.position.x+=(tx-anim.gnote.position.x)*.08;anim.gnote.position.z+=(tz-anim.gnote.position.z)*.08}

    if(anim.cabL){const o=S.f.cabinet?1:0;anim.cabL.rotation.y+=((-1.6*o)-anim.cabL.rotation.y)*.06;anim.cabR.rotation.y+=((1.6*o)-anim.cabR.rotation.y)*.06}
    if(beam){beam.rotation.z+=(anim.beam.t-beam.rotation.z)*.08;panL.rotation.z=-beam.rotation.z;panR.rotation.z=-beam.rotation.z}
    anim.shutter.open+=((S.f.console?1:0)-anim.shutter.open)*.012;shutter.rotation.y=anim.shutter.open*.85;
    if(crateLid){crateLid.rotation.x+=((S.f.crate?-1.7:0)-crateLid.rotation.x)*.06;crystal.visible=!!S.f.crate;crystal.rotation.y+=dt*1.2;crystal.position.y=.42+Math.sin(t*2)*.03+(S.f.crate?.12:0)}
