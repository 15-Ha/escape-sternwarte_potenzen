<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Escape 3D: Die Sternwarte von Dr. Hoch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Caveat:wght@600&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f1e;--panel:#141a30;--panel2:#1d2542;--line:#2f3a63;--text:#eef1fb;--muted:#9ea7c8;--acc:#f4c25b;--acc2:#7cc4ff;--ok:#4ade80;--bad:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--text);font-family:"Space Grotesk",system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.45;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:none}
input{font:inherit;-webkit-user-select:text;user-select:text}
sup{font-size:.62em;line-height:0;position:relative;top:-.15em;margin-left:.04em}
.btn{background:var(--panel2);border:1px solid var(--line);padding:11px 16px;border-radius:12px;font-weight:500;min-height:46px}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc);color:#2a1d02;border-color:var(--acc);font-weight:700}
.btn.danger{background:#3a1820;border-color:#7a2a36}
.btn.small{padding:6px 12px;min-height:44px;min-width:44px;font-size:.95rem}
.btn:disabled{opacity:.4}
#hud{position:fixed;top:0;left:0;right:0;z-index:10;display:none;gap:8px;align-items:center;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:linear-gradient(rgba(0,0,0,.65),transparent);pointer-events:none;flex-wrap:wrap}
#hud>*{pointer-events:auto}
#hud .team{font-weight:700;text-shadow:0 1px 3px #000}
.timer{font-variant-numeric:tabular-nums;font-weight:700;padding:5px 10px;border-radius:9px;background:rgba(20,26,48,.85);border:1px solid var(--line)}
.timer.late{color:var(--bad)}
.inv{display:flex;gap:6px}
.item{background:rgba(20,26,48,.85);border:1px solid var(--line);border-radius:9px;padding:4px 8px;font-size:1.2rem}
.flag{background:#5b1520;color:#ffd5da;border:1px solid #a33;padding:4px 10px;border-radius:8px;font-size:.8rem;font-weight:700}
#hud .tools{margin-left:auto;display:flex;gap:6px}
#hud .tools .btn{background:rgba(20,26,48,.85)}
#joy{position:fixed;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06);display:none;z-index:5;pointer-events:none;transform:translate(-50%,-50%)}
#joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;border-radius:50%;background:rgba(244,194,91,.7);transform:translate(-50%,-50%)}
#help{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:6;background:rgba(11,15,30,.8);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:.85rem;color:var(--muted);text-align:center;pointer-events:none;display:none;max-width:92vw}
#toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(11,15,30,.94);border:1px solid var(--acc);border-radius:12px;padding:10px 16px;display:none;max-width:90vw;text-align:center}
#ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(0,0,0,.55)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:720px;width:100%;max-height:90vh;overflow:auto;position:relative}
.panel h2{margin:.1em 0 .5em;font-size:1.35rem;padding-right:44px}
.panel .x{position:absolute;top:8px;right:8px;width:46px;height:46px;border-radius:50%;background:var(--panel2);font-size:1.1rem}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;justify-content:flex-end}
.note{background:#f4ecd4;color:#2b2416;border-radius:6px;padding:16px 18px;font-family:"Caveat",cursive;font-size:1.55rem;line-height:1.3;box-shadow:0 6px 18px rgba(0,0,0,.5);transform:rotate(-.6deg)}
.note sup{font-size:.6em}
.note.type{font-family:Georgia,serif;font-size:1.05rem;line-height:1.5;background:#efe9da;transform:rotate(.4deg)}
.note.type h4{font-family:"Cinzel",Georgia,serif;margin:0 0 6px;font-size:1.25rem;border-bottom:2px solid #2b2416}
.muted{color:var(--muted)}
.screen{background:#07142a;border:2px solid #1f3d6e;border-radius:10px;padding:16px;font-family:"Courier New",monospace;color:#9fd2ff}
.screen input{background:#0b1f3d;border:1px solid #2c5a9a;color:#cfe8ff;padding:10px;border-radius:6px;font-family:inherit;font-size:1.2rem;width:170px}
.wheels{display:flex;gap:4px;justify-content:center;flex-wrap:nowrap;overflow-x:auto;padding:6px 2px}
.wheel{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:50px}
.wheel small{color:var(--muted);font-size:.72rem;font-weight:700}
.wheel b{width:48px;height:56px;border-radius:9px;background:#0a0d18;border:1px solid #6b5420;display:flex;align-items:center;justify-content:center;font-size:1.8rem;color:var(--acc);font-variant-numeric:tabular-nums}
.wheel button{width:48px;height:46px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-size:1rem}
.wheel button:active{background:var(--acc);color:#2a1d02}
.lever{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.lever .say{flex:1}
.tog{display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.tog button{padding:8px 10px;min-height:44px;background:#0f1428;font-size:.88rem;min-width:84px}
.tog button.on.t{background:#1f6b3a;color:#fff}.tog button.on.f{background:#7a2a36;color:#fff}
.wts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.wt{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:10px 12px;min-width:96px}
.wt.sel{border-color:var(--acc);background:#3a2e12}
.wt .lbl{font-size:1.2rem;font-weight:700;white-space:nowrap}
.dials{display:grid;grid-template-columns:repeat(8,auto);gap:8px;align-items:center;justify-content:center}
.dials b{min-width:74px;text-align:center;font-size:1.5rem;color:var(--acc);font-variant-numeric:tabular-nums}
.display{display:flex;justify-content:center;gap:8px;margin:12px 0}
.display span{width:44px;height:60px;border-radius:10px;background:#0a0d18;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;color:var(--acc)}
.dots{display:flex;justify-content:center;gap:8px}
.dots i{width:40px;height:16px;border-radius:8px;display:block}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:290px;margin:0 auto}
.keypad button{background:var(--panel2);border:1px solid var(--line);border-radius:14px;font-size:1.5rem;height:60px}
.keypad button:active{background:var(--acc);color:#2a1d02}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.memo{background:#2a2410;border:1px dashed #8a7430;border-radius:12px;padding:8px 12px;margin:10px 0;font-size:.95rem}.memo>b:first-child{color:var(--acc)}
.keypad.tk{gap:8px}.keypad.tk button{height:50px}
.pin{display:flex;justify-content:center;gap:8px;margin:8px 0 4px}.pin span{width:40px;height:52px;border-radius:8px;background:#0b1f3d;border:1px solid #2c5a9a;display:flex;align-items:center;justify-content:center;font-size:1.7rem;font-weight:700;color:#cfe8ff}
.fn{display:flex;justify-content:center;margin-top:16px}.fn img{height:44px;background:#f1ede2;border-radius:12px;padding:8px 16px}
.hintlist{display:grid;gap:8px}
.hintlist button{text-align:left}
.hint{background:#2a2410;border:1px solid #5d4d17;border-radius:12px;padding:10px 14px;margin-top:8px}
.clip{background:#f3eedf;color:#222;border-radius:4px;padding:12px 14px;font-family:Georgia,serif;font-size:.98rem;box-shadow:0 4px 12px rgba(0,0,0,.45)}
.clip h4{margin:0 0 4px;font-size:1.08rem}
.clips{display:grid;gap:12px}
#start{position:fixed;inset:0;z-index:40;overflow:auto;background:radial-gradient(900px 500px at 80% 0%,#2a2350,transparent 60%),radial-gradient(800px 500px at 0% 100%,#0e2b4a,transparent 60%),#0b0f1e;display:flex;align-items:flex-start;justify-content:center;padding:12px 14px}
#start .in{max-width:640px;width:100%}
.hero{text-align:center}.hero p{margin:.3em 0}.hero .big{font-size:2.4rem;line-height:1.1}.hero h1{margin:.1em 0;font-size:2rem;font-family:"Cinzel",Georgia,serif}.hero h1 span{color:var(--acc)}
.form{display:grid;gap:12px;margin-top:14px}
.form label{display:grid;gap:5px;font-weight:500}
.form input,.form select{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:11px;border-radius:10px;font:inherit}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:180px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}
.ctl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.92rem}
.cert{border:2px solid var(--acc);border-radius:18px;padding:20px;background:linear-gradient(160deg,#2a2350,var(--panel));text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--panel2);border-radius:12px;padding:8px}.stat b{display:block;font-size:1.4rem;color:var(--acc)}
#loading{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#0b0f1e;font-size:1.2rem;text-align:center;padding:20px}
.confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:60;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<div id="loading">🔭 Die Sternwarte wird aufgebaut …</div>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="joy"><i></i></div>
<div id="help"></div>
<div id="toast"></div>
<div id="ov"></div>
<div id="start"></div>

<script>
window.addEventListener('error',function(e){var l=document.getElementById('loading');if(l)l.innerHTML='⚠️ Der 3D-Raum konnte nicht starten.<br><small>'+(e.message||'')+'</small><br>Bitte Seite neu laden oder «Grafik: Einfach» wählen.'});
setTimeout(function(){var l=document.getElementById('loading');if(l)l.innerHTML='⏳ Das Laden dauert ungewöhnlich lange …<br><small>Bitte Seite neu laden. Funktioniert es weiterhin nicht: iPad auf iPadOS 16.4 oder neuer aktualisieren.</small>'},15000);
</script>
